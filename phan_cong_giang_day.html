<!--
  TRANG NÀY DÙNG ĐỘC LẬP — host ở bất kỳ đâu (website riêng của trường, GitHub Pages, v.v.)
  Dữ liệu vẫn lấy trực tiếp từ Google Sheet thật thông qua Apps Script Web App.

  CÁCH DÙNG:
  1. Trong Google Sheet, mở Apps Script (nơi có file webapp.gs), đảm bảo đã dán bản mới nhất
     có thêm hàm doPost() và jsonOutput().
  2. Bấm Triển khai (Deploy) > Quản lý triển khai (Manage deployments) > Sửa (Edit) phiên bản đang dùng
     (hoặc Triển khai mới nếu chưa từng deploy) > lưu lại để lấy link kết thúc bằng "/exec".
  3. Copy link đó, dán đè vào biến API_URL trong thẻ <script> bên dưới (tìm dòng có chữ "DÁN_LINK").
  4. Lưu file, tải lên website riêng của trường (hoặc bất kỳ nơi host HTML tĩnh nào). Xong.

  LƯU Ý: Web App phải được triển khai với quyền truy cập "Bất kỳ ai có đường liên kết"
  thì trang ngoài mới gọi được API, vì trình duyệt của giáo viên sẽ gọi thẳng tới Google,
  không đi qua máy chủ nào khác.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#1B2A4A;
      --ink-soft:#3C4A68;
      --paper:#FBF9F4;
      --paper-line:#E4DFD1;
      --card:#FFFFFF;
      --brass:#B08D57;
      --brass-dark:#8C6F42;
      --slate:#6B7280;
      --good:#2F6F4E;
      --good-bg:#EAF3EC;
      --warn:#9A5B23;
      --warn-bg:#FBF0E2;
      --teal-deep:#0B5C59;
      --teal:#0E7C77;
      --teal-light:#E3F3F1;
      --danger:#B3261E;
      --danger-bg:#FBEAE9;
      --radius:10px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--paper);
      background-image:linear-gradient(var(--paper-line) 1px, transparent 1px);
      background-size:100% 42px;
      color:var(--ink);
      font-family:'Inter',system-ui,sans-serif;
      min-height:100vh;
    }
    .page-content{padding:40px 20px 80px;}
    .wrap{max-width:420px;margin:0 auto;}

    /* ---- Brand header / footer (full-bleed) ---- */
    .brand-header{
      background:linear-gradient(135deg, var(--teal-deep), var(--teal) 70%);
      padding:26px 20px;
      box-shadow:0 2px 10px rgba(11,92,89,.25);
    }
    .brand-header-inner{max-width:420px;margin:0 auto;display:flex;align-items:center;gap:16px;}
    .brand-logo{width:52px;height:52px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));}
    .brand-school{
      font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;
      text-transform:uppercase;color:#CFEDE9;margin:0 0 4px;
    }
    .brand-header h1{
      font-family:'Source Serif 4',serif;font-weight:700;font-size:19px;line-height:1.25;
      color:#fff;margin:0;letter-spacing:-.01em;
    }
    .brand-footer{background:linear-gradient(135deg, var(--teal-deep), var(--teal) 70%);margin-top:48px;padding:20px 20px 24px;}
    .brand-footer-inner{max-width:420px;margin:0 auto;color:#DCF1EF;font-size:12px;line-height:1.6;text-align:center;}

    /* ---- Card (kieu "step") ---- */
    .card{
      background:var(--card);
      border:1px solid var(--paper-line);
      border-radius:var(--radius);
      padding:26px 26px 24px;
      margin-bottom:20px;
      box-shadow:0 2px 8px rgba(11,92,89,.06);
      border-top:2.5px solid var(--teal);
    }
    .card h2{
      font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;margin:0 0 4px;color:var(--ink);
    }
    .card .hint{font-size:13px;color:var(--slate);margin:0 0 20px;line-height:1.5;}

    /* ---- Field / input (kieu mono nhu ban goc) ---- */
    label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.02em;}
    .field{margin-bottom:16px;}
    input[type=text], input[type=password], input[type=number], select{
      width:100%;padding:10px 12px;border:1px solid var(--paper-line);
      border-radius:6px;font-size:14px;font-family:'IBM Plex Mono',monospace;
      background:#fff;color:var(--ink);
    }
    input:focus, select:focus{outline:2px solid var(--brass);outline-offset:1px;}
    .pw-row{position:relative;}
    .pw-row input{padding-right:52px;}
    .pw-toggle{
      position:absolute;right:8px;top:50%;transform:translateY(-50%);
      border:none;background:none;cursor:pointer;color:var(--slate);
      font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.04em;
      padding:6px 6px;
    }
    .pw-toggle:hover{color:var(--teal-deep);}

    button.primary{
      width:100%;background:var(--teal-deep);color:#fff;border:none;
      padding:12px 22px;border-radius:7px;font-size:14.5px;font-weight:600;
      cursor:pointer;font-family:'Inter',sans-serif;margin-top:4px;
      transition:background .15s ease, transform .08s ease;
    }
    button.primary:hover{background:var(--teal);}
    button.primary:active{transform:scale(.98);}
    button.primary:disabled{background:#B7BDC9;cursor:not-allowed;}
    button.ghost{
      width:100%;background:none;border:1px solid var(--paper-line);color:var(--ink-soft);
      padding:11px 18px;border-radius:7px;font-size:14px;cursor:pointer;font-weight:600;
      margin-top:10px;font-family:'Inter',sans-serif;
    }
    button.ghost:hover{border-color:var(--teal);color:var(--teal-deep);}

    .status-line{font-size:12.5px;color:var(--slate);margin-top:12px;padding:9px 12px;border-radius:6px;display:none;}
    .status-line.err{color:var(--danger);background:var(--danger-bg);display:block;}
    .status-line.ok{color:var(--good);background:var(--good-bg);display:block;}

    .welcome{font-size:13px;color:var(--slate);margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--paper-line);}

    table.preview{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px;}
    table.preview th{
      text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
      letter-spacing:.05em;text-transform:uppercase;color:var(--slate);
      border-bottom:1.5px solid var(--ink);padding:8px 8px;
    }
    table.preview td{padding:8px 8px;border-bottom:1px solid var(--paper-line);}
    table.preview tr:last-child td{border-bottom:none;}
    .del{
      color:var(--danger);cursor:pointer;font-size:11.5px;font-weight:600;
      font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;
    }
    .del:hover{text-decoration:underline;}

    .hidden{display:none;}
  </style>
</head>

    function callApi(action, params) {
      if (!API_URL || API_URL.indexOf('DÁN_LINK') !== -1) {
        return Promise.reject(new Error('Chưa cấu hình API_URL trong file HTML. Xem hướng dẫn ở đầu file.'));
      }
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, params: params })
      })
        .then(function(res) { return res.json(); })
        .then(function(json) {
          if (json && json.__error) { throw new Error(json.message); }
          return json;
        });
    }

    function togglePw() {

      const btn = document.querySelector('.pw-toggle');
      if (input.type === 'password') { input.type = 'text'; btn.textContent = 'ẨN'; }
      else { input.type = 'password'; btn.textContent = 'HIỆN'; }
    }

    function showMsg(elId, text, type) {
      const el = document.getElementById(elId);
      el.textContent = text;
      el.className = 'status-line ' + type;
    }
    function clearMsg(elId) {
      const el = document.getElementById(elId);
      el.textContent = '';
      el.className = 'status-line';
    }

    function doLogin() {
      const hoTen = document.getElementById('hoTen').value;
      const matKhau = document.getElementById('matKhau').value;
      if (!hoTen || !matKhau) { showMsg('loginMsg', 'Nhập đầy đủ họ tên và mật khẩu.', 'err'); return; }
      document.getElementById('loginBtn').disabled = true;
      clearMsg('loginMsg');
      callApi('login', { hoTen: hoTen, matKhau: matKhau })
        .then(function(res) {
          document.getElementById('loginBtn').disabled = false;
          if (!res.success) { showMsg('loginMsg', res.message, 'err'); return; }
          session = res;
          document.getElementById('loginCard').classList.add('hidden');
          document.getElementById('formCard').classList.remove('hidden');
          document.getElementById('listCard').classList.remove('hidden');
          document.getElementById('welcome').textContent = 'Xin chào, ' + res.hoTen;
          const sel = document.getElementById('monHoc');
          sel.innerHTML = '';
          res.subjects.forEach(function(s) {
            const opt = document.createElement('option');
            opt.value = s; opt.textContent = s;
            sel.appendChild(opt);
          });
          loadClassData();
          refreshList();
        })
        .catch(function(err) {
          document.getElementById('loginBtn').disabled = false;
          showMsg('loginMsg', 'Lỗi: ' + err.message, 'err');
        });
    }

    function doLogout() {
      session = null;
      document.getElementById('loginCard').classList.remove('hidden');
      document.getElementById('formCard').classList.add('hidden');
      document.getElementById('listCard').classList.add('hidden');
      document.getElementById('hoTen').value = '';
      document.getElementById('matKhau').value = '';
      clearMsg('loginMsg');
    }

    function loadClassData() {
      callApi('getClassData', {})
        .then(function(data) {
          classData = data;
          const khoiList = [];
          data.forEach(function(item) {
            if (khoiList.indexOf(item.khoi) === -1) khoiList.push(item.khoi);
          });
          const khoiSel = document.getElementById('khoi');
          khoiSel.innerHTML = '';
          khoiList.forEach(function(k) {
            const opt = document.createElement('option');
            opt.value = k; opt.textContent = k;
            khoiSel.appendChild(opt);
          });
          onKhoiChange();
        })
        .catch(function(err) { showMsg('formMsg', 'Lỗi tải danh sách lớp: ' + err.message, 'err'); });
    }

    function onKhoiChange() {
      const khoi = document.getElementById('khoi').value;
      const lopSel = document.getElementById('lopHoc');
      lopSel.innerHTML = '';
      classData
        .filter(function(item) { return item.khoi === khoi; })
        .forEach(function(item) {
          const opt = document.createElement('option');
          opt.value = item.lop; opt.textContent = item.lop;
          lopSel.appendChild(opt);
        });
    }

    function doSubmit() {
      if (!session) return;
      const monHoc = document.getElementById('monHoc').value;
      const lopHoc = document.getElementById('lopHoc').value;
      const soTiet = document.getElementById('soTiet').value;
      if (!monHoc || !lopHoc || !soTiet) { showMsg('formMsg', 'Điền đầy đủ thông tin.', 'err'); return; }
      document.getElementById('submitBtn').disabled = true;
      clearMsg('formMsg');
      callApi('submitAssignment', { maGV: session.maGV, monHoc: monHoc, lopHoc: lopHoc, soTiet: soTiet })
        .then(function() {
          document.getElementById('submitBtn').disabled = false;
          showMsg('formMsg', 'Đã thêm thành công!', 'ok');
          document.getElementById('soTiet').value = '';
          refreshList();
        })
        .catch(function(err) {
          document.getElementById('submitBtn').disabled = false;
          showMsg('formMsg', 'Lỗi: ' + err.message, 'err');
        });
    }

    function refreshList() {
      if (!session) return;
      callApi('getMyAssignments', { maGV: session.maGV })
        .then(function(list) {
          const body = document.getElementById('listBody');
          body.innerHTML = '';
          list.forEach(function(item) {
            const tr = document.createElement('tr');

            const tdMon = document.createElement('td'); tdMon.textContent = item.monHoc;
            const tdLop = document.createElement('td'); tdLop.textContent = item.lopHoc;
            const tdSoTiet = document.createElement('td'); tdSoTiet.textContent = item.soTiet;
            const tdDel = document.createElement('td');
            const delBtn = document.createElement('span');
            delBtn.textContent = 'Xóa';
            delBtn.className = 'del';
            delBtn.onclick = function() { doDelete(item.row); };
            tdDel.appendChild(delBtn);

            tr.appendChild(tdMon); tr.appendChild(tdLop); tr.appendChild(tdSoTiet); tr.appendChild(tdDel);
            body.appendChild(tr);
          });
        })
        .catch(function(err) { showMsg('formMsg', 'Lỗi tải danh sách: ' + err.message, 'err'); });
    }

    function doDelete(rowIndex) {
      if (!session) return;
      if (!confirm('Xóa dòng này?')) return;
      callApi('deleteAssignment', { maGV: session.maGV, rowIndex: rowIndex })
        .then(function() { refreshList(); })
        .catch(function(err) { showMsg('formMsg', 'Lỗi: ' + err.message, 'err'); });
    }
  </script>
</body>
</html>
